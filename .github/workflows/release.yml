name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag (e.g. v0.9.5-core-tui.1) to publish a GitHub Release; leave blank to build artifacts only"
        required: false
        type: string
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: stable
  RUSTUP_TOOLCHAIN: stable

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-core-tui-linux-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-core-tui-linux-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdr-core-tui-macos-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdr-core-tui-macos-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            name: herdr-core-tui-windows-x86_64.zip
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'

    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ${{ matrix.libghostty_vt_optimize }}
      LIBGHOSTTY_VT_SIMD: ${{ matrix.libghostty_vt_simd }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo.toml version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          RELEASE_TAG="${INPUT_TAG}"
          if [ -z "$RELEASE_TAG" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "Building release artifacts without a tag."
            exit 0
          fi
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_BASE="${RELEASE_TAG#v}"
          TAG_BASE="${TAG_BASE%%[-+]*}"
          if [ "$CARGO_VERSION" != "$TAG_BASE" ]; then
            echo "error: tag $RELEASE_TAG (base $TAG_BASE) doesn't match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
            echo "Using apt mirrors:"
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="target/${{ matrix.target }}/release"
          cp "${bin_dir}/herdr-core-tui" "${{ matrix.name }}"
          tar -czf "${{ matrix.name }}.tar.gz" -C "${bin_dir}" herdr-core-tui hc-tui
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ] || [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            "${bin_dir}/herdr-core-tui" --version
            "${bin_dir}/hc-tui" --version
          fi

      - name: Package artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $verifyStage = Join-Path $env:RUNNER_TEMP "verify-conpty-stage"
          $verifyZip = Join-Path $env:RUNNER_TEMP "verify-conpty.zip"
          $stage = Join-Path $env:RUNNER_TEMP "herdr-core-tui-windows-x86_64"
          $binDir = "target\${{ matrix.target }}\release"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe (Join-Path $binDir "herdr-core-tui.exe") `
            -PackagePath $package `
            -StageDir $verifyStage `
            -OutputPath $verifyZip
          python scripts\package_windows_conpty.py stage `
            --package $package `
            --herdr-exe (Join-Path $binDir "herdr-core-tui.exe") `
            --binary-name "herdr-core-tui.exe" `
            --alias-exe (Join-Path $binDir "hc-tui.exe") `
            --alias-name "hc-tui.exe" `
            --output-dir $stage
          $version = (& (Join-Path $stage "herdr-core-tui.exe") --version | Out-String).Trim()
          if (-not $version) {
            throw "herdr-core-tui.exe --version returned empty output"
          }
          $aliasVersion = (& (Join-Path $stage "hc-tui.exe") --version | Out-String).Trim()
          if ($aliasVersion -ne $version) {
            throw "hc-tui.exe --version mismatch: '$aliasVersion' vs '$version'"
          }
          python scripts\package_windows_conpty.py archive `
            --stage-dir $stage `
            --binary-name "herdr-core-tui.exe" `
            --alias-name "hc-tui.exe" `
            --output "${{ matrix.name }}"
          if ($version -notmatch '^herdr-core-tui ') {
            throw "Packaged Windows binary has unexpected version identity: $version"
          }
          $releaseTag = if ($env:INPUT_TAG) { $env:INPUT_TAG } elseif ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { "" }
          if ($releaseTag) {
            $tagBase = (($releaseTag -replace '^v', '') -split '[-+]')[0]
            if ($version -notmatch [regex]::Escape($tagBase)) {
              throw "Packaged Windows binary version '$version' does not match tag base '$tagBase'"
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}*

  release:
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets

      - name: Prepare release files and checksums
        id: prep
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          PRERELEASE="false"
          TAG_SUFFIX=""
          if [[ "$TAG" == *-* ]]; then
            TAG_SUFFIX="${TAG#*-}"
          fi
          if [ "$INPUT_PRERELEASE" = "true" ] || { [ -n "$TAG_SUFFIX" ] && ! [[ "$TAG_SUFFIX" =~ ^core-tui\.[0-9]+$ ]]; }; then
            PRERELEASE="true"
          fi
          mkdir -p dist
          find release-assets -type f ! -name 'SHA256SUMS.txt' -exec cp {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist
          {
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: "herdr-core-tui ${{ steps.prep.outputs.tag }}"
          prerelease: ${{ steps.prep.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*
